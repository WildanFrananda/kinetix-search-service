# Kinetix search CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.
#
# Three things are guarded here, and each is something this repository can get wrong quietly:
#
#   * the hexagon. `bin/check-core-purity` walks `go list -deps` over internal/search and fails if
#     anything outside the standard library appears. The rule is an import rule; a rule nothing
#     runs is a comment.
#   * the engine. The suite runs against a REAL Typesense, because without KINETIX_TYPESENSE_URL
#     the engine tests skip, and a skipped test proves nothing.
#   * the coverage flags. `bin/test` exists because tests live in tests/ rather than beside the
#     code, and plain `go test -cover ./...` reports 0.0% for every package under internal/ — a
#     lie that looks like a damning fact.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

variables:
  GOTOOLCHAIN: local

.go:
  image: golang:1.26-bookworm
  before_script:
    # protobuf-compiler alone is not enough: Debian's protoc is 3.21.12 and reads
    # google/protobuf/*.proto from /usr/include, shipped by libprotobuf-dev. Without it every
    # contract importing Timestamp fails to compile while building fine on a laptop whose
    # Homebrew protoc bundles them.
    - apt-get update -qq && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
    - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - ./bin/sync-contracts
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go

secret-scan:
  extends: .secret-scan

build-image:
  extends: .build-image

purity:
  extends: .go
  stage: verify
  script:
    - ./bin/check-core-purity
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  extends: .go
  stage: verify
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - golangci-lint run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  extends: .go
  stage: test
  services:
    - name: typesense/typesense:30.2
      alias: typesense
      command: ["--data-dir=/data", "--api-key=ci-ephemeral-not-a-deployed-credential"]
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
    POSTGRES_DB: kinetix_search_dev
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    KINETIX_TYPESENSE_URL: http://typesense:8108
    KINETIX_TYPESENSE_KEY: ci-ephemeral-not-a-deployed-credential
    SEARCH_DATABASE_URL: postgres://ci:ci-ephemeral-not-a-deployed-credential@postgres:5432/kinetix_search_dev?sslmode=disable
  script:
    - go build ./...
    - go run ./cmd/migrate
    - ./bin/test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
